# Segredos (DB_*, JWT_SECRET, MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET) ficam no
# Secret oficina-billing-secrets, criado pelo pipeline a partir do Secrets
# Manager; ele nao e versionado. O acesso ao SQS usa a LabRole dos nodes (o
# AWS Academy nao permite IRSA), lida pelo SDK via metadata da instancia.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-billing-service
  namespace: oficina
  labels:
    app: oficina-billing-service
    app.kubernetes.io/part-of: oficina
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: oficina-billing-service
  template:
    metadata:
      labels:
        app: oficina-billing-service
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3002'
        prometheus.io/path: '/api/metrics'
    spec:
      # Da tempo ao consumidor SQS de terminar o long polling (20s) no shutdown.
      terminationGracePeriodSeconds: 40
      containers:
        - name: api
          image: IMAGEM_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          envFrom:
            - configMapRef:
                name: oficina-billing-config
            - secretRef:
                name: oficina-billing-secrets
          startupProbe:
            httpGet: { path: /api/health, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ['ALL']
