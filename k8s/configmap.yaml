apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-billing-config
  namespace: oficina
data:
  NODE_ENV: 'production'
  PORT: '3002'
  LOG_FORMAT: 'json'
  # Traces e logs OTLP para o OpenTelemetry Collector do cluster (repositório de infra).
  OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector.monitoring.svc.cluster.local:4318'
  OTEL_SERVICE_NAME: 'billing-service'
  # Prefixo do serviço no API Gateway, para o "Try it out" do Swagger funcionar.
  SWAGGER_PREFIXO: '/billing'
  DB_SSL: 'true'
  DB_MIGRATIONS_RUN: 'true'
  AWS_REGION: 'us-east-1'
  # O pipeline troca ACCOUNT_ID_PLACEHOLDER pela conta da sessao do AWS Academy.
  SQS_BILLING_COMANDOS_URL: 'https://sqs.us-east-1.amazonaws.com/ACCOUNT_ID_PLACEHOLDER/billing-comandos'
  SQS_OS_EVENTOS_URL: 'https://sqs.us-east-1.amazonaws.com/ACCOUNT_ID_PLACEHOLDER/os-eventos'
  SQS_CONSUMER_ENABLED: 'true'
  OUTBOX_PUBLISHER_ENABLED: 'true'
  OUTBOX_INTERVALO_MS: '1000'
  # Link do orcamento enviado ao cliente: endereco publico do API Gateway.
  PUBLIC_BASE_URL: 'https://api.oficina.exemplo.com.br'
  MP_MODO: 'fake'
  MP_BASE_URL: 'https://api.mercadopago.com'
  MP_TIMEOUT_MS: '10000'
